name: CI

# 质量门禁：main 直推与 PR 都跑（前端类型检查 + Rust lint/测试）
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 版本自动取 package.json 的 packageManager 字段（pnpm@11.24.0）
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # 缓存 src-tauri 编译产物：Rust 冷构建数分钟 → 热增量数十秒
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 前端：类型检查 + 打包
      - name: Build frontend
        run: pnpm build

      # 后端：lint 门禁（当前 0 告警）+ 单元测试
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Tests
        run: cargo test
        working-directory: src-tauri
