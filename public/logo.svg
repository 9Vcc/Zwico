<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Zwico logo">
  <!--
    Zwico logo — Zed Windows Icon
    核心图形：文件页 + 2x2 图标拼格（对应工具「按扩展名分配独立图标」的核心功能）
    配色取自界面主题：--accent #4a86f7（暗色）/ #2f6fe0（亮色）
    徽章自带实色底，明暗背景均可直接使用
  -->
  <defs>
    <linearGradient id="zwico-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a86f7"/>
      <stop offset="1" stop-color="#2f5fd0"/>
    </linearGradient>
    <linearGradient id="zwico-fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbe6ff"/>
      <stop offset="1" stop-color="#b7cdfb"/>
    </linearGradient>
  </defs>

  <!-- 徽章底 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#zwico-bg)"/>

  <!-- 文件页（右上折角） -->
  <path d="M36 36a6 6 0 0 1 6-6h34l16 16v52a6 6 0 0 1-6 6H42a6 6 0 0 1-6-6Z" fill="#ffffff"/>
  <path d="M76 30l16 16H82a6 6 0 0 1-6-6Z" fill="url(#zwico-fold)"/>

  <!-- 2x2 图标拼格：一格主色，代表「每个扩展名一个专属图标」 -->
  <rect x="48" y="58" width="14" height="14" rx="4" fill="#4a86f7"/>
  <rect x="66" y="58" width="14" height="14" rx="4" fill="#a6c0fa"/>
  <rect x="48" y="76" width="14" height="14" rx="4" fill="#a6c0fa"/>
  <rect x="66" y="76" width="14" height="14" rx="4" fill="#2f5fd0"/>
</svg>
